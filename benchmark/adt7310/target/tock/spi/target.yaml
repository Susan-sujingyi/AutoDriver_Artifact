schema: autodriver.target/v1
os: tock
snapshot: tock
board: nrf52840dk
bus: spi
module: adt7310
editable_paths:
- capsules/extra/src/adt7310.rs
- capsules/extra/src/adt7310/
board_patch: benchmark/adt7310/target/tock/spi/board.patch
application: benchmark/common/applications/tock
native_interface:
  type: Adt7310<'a, S, A>
  constructor: 'pub fn new(spi: &''a S, alarm: &''a A, tx: &''static mut [u8], rx:
    &''static mut [u8]) -> Self'
  startup: pub fn startup(&self) -> Result<(), ErrorCode>
