schema: autodriver.target/v1
os: nuttx
snapshot: nuttx
board: nrf52840-dk
bus: i2c
module: mpu6050
editable_paths:
- drivers/sensors/mpu6050.c
- drivers/sensors/mpu6050/
apps_snapshot: nuttx-apps
native_interface:
  framework: new_sensor
  acquisition_interface: bounded_fetch
  native_events:
  - structure: sensor_accel
    field: x,y,z
    unit: m/s^2
  timestamp_unit: microseconds
  float_configuration: CONFIG_SENSORS_USE_FLOAT=y
application: benchmark/common/applications/nuttx
sampling:
  rounds: 100
  interval_ms: 1000
  startup_ms: 5000
  serial_baud: 115200
support_key: mpu6050
sanitizer: benchmark/mpu6050/target/nuttx/i2c/sanitizer.json
board_support:
  driver_api:
    source: benchmark/mpu6050/target/nuttx/i2c/board-support/driver_api.h
    target: include/nuttx/sensors/mpu6050.h
  resources: []
