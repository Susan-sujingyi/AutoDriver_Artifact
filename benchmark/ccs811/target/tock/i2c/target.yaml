schema: autodriver.target/v1
os: tock
snapshot: tock
board: nrf52840dk
bus: i2c
module: ccs811
editable_paths:
- capsules/extra/src/ccs811.rs
- capsules/extra/src/ccs811/
board_patch: benchmark/ccs811/target/tock/i2c/board.patch
application: benchmark/common/applications/tock
native_interface:
  type: Ccs811<'a, I, A>
  constructor: 'pub fn new(i2c: &''a I, alarm: &''a A, buffer: &''static mut [u8])
    -> Self'
  startup: pub fn startup(&self) -> Result<(), ErrorCode>
  buffer_bytes: 8
  traits:
  - kernel::hil::sensors::AirQualityDriver
  - kernel::hil::i2c::I2CClient
  - kernel::hil::time::AlarmClient
  status: specified
  hil_path: kernel/src/hil/sensors.rs
  notes: 'I: I2CDevice; A: Alarm<''a>. Export pub const BUFFER_SIZE: usize = 8. Register
    I2C, Alarm and AirQuality clients before startup; one owned static mutable buffer.
    No deferred-call registration required.'
output: null
sampling:
  rounds: 100
  interval_ms: 1000
  startup_ms: 10000
  request_timeout_ms: 10000
  serial_baud: 115200
remove_paths:
- capsules/extra/src/ccs811.rs
- capsules/extra/src/ccs811/
