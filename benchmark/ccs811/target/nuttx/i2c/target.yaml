schema: autodriver.target/v1
os: nuttx
snapshot: nuttx
board: nrf52840-dk
bus: i2c
module: ccs811
editable_paths:
- drivers/sensors/ccs811.c
- drivers/sensors/ccs811/
apps_snapshot: nuttx-apps
native_interface:
  framework: new_sensor
  acquisition_interface: bounded_fetch
  native_events:
  - structure: sensor_co2
    field: co2
    unit: ppm_equivalent_CO2
  - structure: sensor_tvoc
    field: tvoc
    unit: ppm_equivalent_TVOC
  timestamp_unit: microseconds
  float_configuration: CONFIG_SENSORS_USE_FLOAT=y
application: benchmark/common/applications/nuttx
sampling:
  rounds: 100
  interval_ms: 1000
  startup_ms: 5000
  serial_baud: 115200
support_key: ccs811
sanitizer: benchmark/ccs811/target/nuttx/i2c/sanitizer.json
board_support:
  driver_api:
    source: benchmark/ccs811/target/nuttx/i2c/board-support/driver_api.h
    target: include/nuttx/sensors/ccs811.h
  resources: []
