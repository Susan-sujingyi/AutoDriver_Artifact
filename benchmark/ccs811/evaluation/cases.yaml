    "co2_ppm": [
      400,
      29206
    ],
    "tvoc_ppb": [
      0,
      32768
    ]
  },
  "notes": [
    "Gas values are calculated by device application firmware, not from RAW_DATA on the host.",
    "Output ranges and byte width are separate checks. Out-of-range words remain decodable and are fault vectors, not clamped results.",
    "Embedded STATUS and ERROR_ID validity checks belong to the protocol model. The optional ADC/current bytes do not affect either gas output.",
    "The physical quantity is an equivalent gas estimate; these vectors do not establish absolute gas accuracy."
  ],
