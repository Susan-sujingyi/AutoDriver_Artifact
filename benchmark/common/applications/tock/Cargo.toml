[package]
name = "driverbench-hardware"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
libtock_console = { path = "../../../../third_party/libtock-rs/apis/interface/console" }
libtock_platform = { path = "../../../../third_party/libtock-rs/platform" }
libtock_runtime = { path = "../../../../third_party/libtock-rs/runtime" }
libtock_small_panic = { path = "../../../../third_party/libtock-rs/panic_handlers/small_panic" }

[build-dependencies]
libtock_build_scripts = { path = "../../../../third_party/libtock-rs/build_scripts" }

[profile.release]
panic = "abort"
lto = true
opt-level = "z"
codegen-units = 1
debug = false
