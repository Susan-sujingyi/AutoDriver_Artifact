schema: autodriver.target/v1
os: tock
snapshot: tock
board: nrf52840dk
bus: i2c
module: lsm6dso
editable_paths:
- capsules/extra/src/lsm6dso.rs
- capsules/extra/src/lsm6dso/
board_patch: benchmark/lsm6dso/target/tock/i2c/board.patch
application: benchmark/common/applications/tock
native_interface:
  type: Lsm6dso<'a, I, A>
  constructor: 'pub fn new(i2c: &''a I, alarm: &''a A, buffer: &''static mut [u8])
    -> Self'
  startup: pub fn startup(&self) -> Result<(), ErrorCode>
  buffer_bytes: 14
  traits:
  - kernel::hil::sensors::NineDof
  - kernel::hil::i2c::I2CClient
  - kernel::hil::time::AlarmClient
  status: specified
  hil_path: kernel/src/hil/sensors.rs
  notes: I:I2CDevice; A:Alarm<'a>. Export BUFFER_SIZE=14. Fixture allocates native
    bus/alarm, exact buffer and scalar NineDof collector, wires clients and calls
    startup. It contains no sensor algorithm.
output:
  unit: "\xB5m/s\xB2"
  representation: signed_integer
  axes: sensor_xyz
sampling:
  rounds: 100
  interval_ms: 1000
  startup_ms: 10000
  request_timeout_ms: 10000
  serial_baud: 115200
remove_paths:
- capsules/extra/src/lsm6dso.rs
- capsules/extra/src/lsm6dso/
