schema: autodriver.target/v1
os: nuttx
snapshot: nuttx
board: nrf52840-dk
bus: i2c
module: lsm6dso
editable_paths:
- drivers/sensors/lsm6dso.c
- drivers/sensors/lsm6dso/
apps_snapshot: nuttx-apps
native_interface:
  framework: new_sensor
  acquisition_interface: bounded_fetch
  native_events:
  - structure: sensor_accel
    field: x,y,z
    unit: m/s^2
  timestamp_unit: microseconds
  float_configuration: CONFIG_SENSORS_USE_FLOAT=y
application: benchmark/common/applications/nuttx
sampling:
  rounds: 100
  interval_ms: 1000
  startup_ms: 5000
  serial_baud: 115200
support_key: lsm6dso
sanitizer: benchmark/lsm6dso/target/nuttx/i2c/sanitizer.json
board_support:
  driver_api:
    source: benchmark/lsm6dso/target/nuttx/i2c/board-support/driver_api.h
    target: include/nuttx/sensors/lsm6dso.h
  resources: []
