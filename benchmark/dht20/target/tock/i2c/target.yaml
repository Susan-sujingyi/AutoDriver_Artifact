schema: autodriver.target/v1
os: tock
snapshot: tock
board: nrf52840dk
bus: i2c
module: dht20
editable_paths:
- capsules/extra/src/dht20.rs
- capsules/extra/src/dht20/
board_patch: benchmark/dht20/target/tock/i2c/board.patch
application: benchmark/common/applications/tock
native_interface:
  type: Dht20<'a, I, A>
  constructor: 'pub fn new(i2c: &''a I, alarm: &''a A, buffer: &''static mut [u8])
    -> Self'
  startup: pub fn startup(&self) -> Result<(), ErrorCode>
  buffer_bytes: 7
  traits:
  - kernel::hil::sensors::TemperatureDriver
  - kernel::hil::sensors::HumidityDriver
  - kernel::hil::i2c::I2CClient
  - kernel::hil::time::AlarmClient
  status: specified
  hil_path: kernel/src/hil/sensors.rs
  notes: I:I2CDevice,A:Alarm<'a>; export BUFFER_SIZE=7. Fixture only wires resources/clients
    and invokes startup; protocol and arithmetic stay in candidate.
output: null
sampling:
  rounds: 100
  interval_ms: 1000
  startup_ms: 10000
  request_timeout_ms: 10000
  serial_baud: 115200
remove_paths:
- capsules/extra/src/dht20.rs
- capsules/extra/src/dht20/
