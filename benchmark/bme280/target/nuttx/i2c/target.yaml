schema: autodriver.target/v1
os: nuttx
snapshot: nuttx
board: nrf52840-dk
bus: i2c
module: bme280
editable_paths:
- drivers/sensors/bme280.c
- drivers/sensors/bme280/
apps_snapshot: nuttx-apps
native_interface:
  framework: new_sensor
  acquisition_interface: bounded_fetch
  native_events:
  - structure: sensor_temp
    field: temperature
    unit: degC
  - structure: sensor_humi
    field: humidity
    unit: percent_RH
  - structure: sensor_baro
    field: pressure
    unit: hPa
  timestamp_unit: microseconds
  float_configuration: CONFIG_SENSORS_USE_FLOAT=y
application: benchmark/common/applications/nuttx
sampling:
  rounds: 100
  interval_ms: 1000
  startup_ms: 5000
  serial_baud: 115200
support_key: bme280
sanitizer: benchmark/bme280/target/nuttx/i2c/sanitizer.json
board_support:
  driver_api:
    source: benchmark/bme280/target/nuttx/i2c/board-support/driver_api.h
    target: include/nuttx/sensors/bme280.h
  resources: []
