schema: autodriver.target/v1
os: tock
snapshot: tock
board: nrf52840dk
bus: spi
module: bme280
editable_paths:
- capsules/extra/src/bme280.rs
- capsules/extra/src/bme280/
board_patch: benchmark/bme280/target/tock/spi/board.patch
application: benchmark/common/applications/tock
native_interface:
  type: Bme280<'a, S, A>
  constructor: 'pub fn new(spi: &''a S, alarm: &''a A, tx: &''static mut [u8], rx:
    &''static mut [u8]) -> Self'
  startup: pub fn startup(&self)
  buffer_bytes: 32
  traits:
  - kernel::hil::sensors::TemperatureDriver
  - kernel::hil::sensors::HumidityDriver
  - kernel::hil::sensors::PressureDriver
  - kernel::hil::spi::SpiMasterClient
  - kernel::hil::time::AlarmClient
  status: specified
  hil_path: kernel/src/hil/sensors.rs
  notes: 'S: SpiMasterDevice<''a>; A: Alarm<''a>. Two owned static mutable buffers,
    32 bytes each; see public resource component.'
output: null
sampling:
  rounds: 100
  interval_ms: 1000
  startup_ms: 10000
  request_timeout_ms: 10000
  serial_baud: 115200
wiring:
  controller: spim2
  MOSI: P1.13
  MISO: P1.14
  SCK: P1.15
  CS: P1.04
remove_paths:
- capsules/extra/src/bme280.rs
- capsules/extra/src/bme280/
