schema: autodriver.target/v1
os: nuttx
snapshot: nuttx
board: nrf52840-dk
bus: i2c
module: isl29035
editable_paths:
- drivers/sensors/isl29035.c
- drivers/sensors/isl29035/
apps_snapshot: nuttx-apps
native_interface:
  framework: new_sensor
  acquisition_interface: bounded_fetch
  native_events:
  - structure: sensor_light
    field: light
    unit: lux
  timestamp_unit: microseconds
  float_configuration: CONFIG_SENSORS_USE_FLOAT=y
application: benchmark/common/applications/nuttx
sampling:
  rounds: 100
  interval_ms: 1000
  startup_ms: 5000
  serial_baud: 115200
support_key: isl29035
sanitizer: benchmark/isl29035/target/nuttx/i2c/sanitizer.json
board_support:
  driver_api:
    source: benchmark/isl29035/target/nuttx/i2c/board-support/driver_api.h
    target: include/nuttx/sensors/isl29035.h
  resources: []
