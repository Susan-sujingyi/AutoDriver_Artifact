schema: autodriver.target/v1
os: tock
snapshot: tock
board: nrf52840dk
bus: i2c
module: bmm150
editable_paths:
- capsules/extra/src/bmm150.rs
- capsules/extra/src/bmm150/
board_patch: benchmark/bmm150/target/tock/i2c/board.patch
application: benchmark/common/applications/tock
native_interface:
  type: Bmm150<'a, I, A>
  constructor: 'pub fn new(i2c: &''a I, alarm: &''a A, buffer: &''static mut [u8])
    -> Self'
  startup: pub fn startup(&self) -> Result<(), ErrorCode>
  buffer_bytes: 21
  traits:
  - kernel::hil::sensors::NineDof
  - kernel::hil::i2c::I2CClient
  - kernel::hil::time::AlarmClient
  status: specified
  hil_path: kernel/src/hil/sensors.rs
  notes: I:I2CDevice; A:Alarm<'a>. Export BUFFER_SIZE:usize=21. Native NineDof magnetic
    XYZ, low32 signed i32 nanotesla. Public fixture only wires resources/clients.
output:
  unit: nT
  representation: signed_integer
  axes: sensor_xyz
sampling:
  rounds: 100
  interval_ms: 1000
  startup_ms: 10000
  request_timeout_ms: 10000
  serial_baud: 115200
remove_paths:
- capsules/extra/src/bmm150.rs
- capsules/extra/src/bmm150/
