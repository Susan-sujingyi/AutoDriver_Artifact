[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autodriver-artifacts"
version = "0.3.0"
description = "Standalone AutoDriver method and 44-task driver migration benchmark"
requires-python = ">=3.13,<3.14"
dependencies = ["PyYAML==6.0.3"]

[project.scripts]
artifact-bench = "tests.common.pipeline:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["benchmark.common*", "method*", "tests.common*"]
namespaces = true
